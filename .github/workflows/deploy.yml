name: Deploy Autonomous AI Portfolio OS

# ─── Trigger ────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
  workflow_dispatch:

# ─── Permissions ────────────────────────────────────────────────────
permissions:
  contents: write
  pages: write
  id-token: write

# ─── Jobs ───────────────────────────────────────────────────────────
jobs:
  build-and-deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js 20 LTS
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Install project dependencies
      - name: 📦 Install Dependencies
        run: npm ci

      # 4. Build production bundle
      - name: ⚡ Build Vite Production Bundle
        run: npm run build

      # 5. Deploy built /dist folder to GitHub Pages (gh-pages branch)
      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: "GitHub Actions Bot"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "🤖 Auto-Deploy: AI Portfolio OS Update from main branch"
